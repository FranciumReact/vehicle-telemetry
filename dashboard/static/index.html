<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vehicle Telemetry</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee;
           margin:0; padding:2rem; }
    h1 { font-size:1.2rem; font-weight:600; margin:0 0 .25rem; }
    #status { font-size:.85rem; color:#888; margin-bottom:1.5rem; }
    .live { color:#4ade80; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:1rem; }
    .card { background:#1c1c1c; border:1px solid #2a2a2a; border-radius:8px;
            padding:1rem; }
    .label { font-size:.75rem; color:#888; text-transform:uppercase;
             letter-spacing:.05em; }
    .value { font-size:2rem; font-weight:300; margin-top:.25rem; }
    .unit { font-size:.9rem; color:#888; margin-left:.25rem; }
  </style>
</head>
<body>
  <h1>Vehicle Telemetry</h1>
  <div id="status">connecting…</div>
  <div class="grid" id="grid"></div>

<script>
async function refresh() {
  try {
    const res  = await fetch('/api/latest');
    const data = await res.json();

    const status = document.getElementById('status');
    const grid   = document.getElementById('grid');

    if (!data.session) {
      status.textContent = 'No sessions recorded';
      grid.innerHTML = '';
      return;
    }

    const s = data.session;
    status.innerHTML = s.live
      ? `Session ${s.id} · ${s.vehicle} · <span class="live">LIVE</span>`
      : `Session ${s.id} · ${s.vehicle} · ended ${new Date(s.ended).toLocaleTimeString()}`;

    grid.innerHTML = Object.entries(data.signals).map(([name, sig]) => `
      <div class="card">
        <div class="label">${name}</div>
        <div class="value">${sig.value.toFixed(1)}<span class="unit">${sig.unit}</span></div>
      </div>
    `).join('');

  } catch (e) {
    document.getElementById('status').textContent = 'Connection failed';
  }
}

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
