services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vehicle_telemetry
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # development only
    volumes:
      # Scripts in this directory run once, in name order, on first start.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_telemetry"]
      interval: 2s
      timeout: 3s
      retries: 15

  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    environment:
      TELEMETRY_DB: "host=db dbname=vehicle_telemetry user=postgres password=postgres"
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    environment:
      TELEMETRY_DB: "host=db dbname=vehicle_telemetry user=postgres password=postgres"
      FLASK_HOST: 0.0.0.0
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: